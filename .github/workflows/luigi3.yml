name: Luigi3 griglia MD FMD

on:
  workflow_dispatch:
    inputs:
      NI:
        description: "righe (iL -> E)"
        default: "200"
      NJ:
        description: "colonne (jL -> a)"
        default: "200"
      OMEGA:
        description: "omega_base (originale 3.13)"
        default: "3.13"
      LL:
        description: "p.ll (originale 1)"
        default: "1"
      C:
        description: "p.c smorzamento (originale 0.1)"
        default: "0.1"
      K:
        description: "numero di fette (job), max 256"
        default: "200"

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Parallel_Computing_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: verifica_ci3(${{ inputs.OMEGA }}, ${{ inputs.LL }}, ${{ inputs.C }})

  prepara:
    needs: verifica
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c 'import json;print(json.dumps(list(range(1,${{ inputs.K }}+1))))')" >> "$GITHUB_OUTPUT"

  calcola:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        k: ${{ fromJson(needs.prepara.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Parallel_Computing_Toolbox
          cache: true
      - uses: matlab-actions/run-command@v2
        with:
          command: run_shard3(${{ matrix.k }}, ${{ inputs.K }}, ${{ inputs.NI }}, ${{ inputs.NJ }}, ${{ inputs.OMEGA }}, ${{ inputs.LL }}, ${{ inputs.C }})
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.k }}
          path: shard_${{ matrix.k }}.mat
          retention-days: 7

  unisci:
    needs: calcola
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: merge_shards3(${{ inputs.NI }}, ${{ inputs.NJ }}, ${{ inputs.OMEGA }}, ${{ inputs.LL }}, ${{ inputs.C }})
      - uses: actions/upload-artifact@v4
        with:
          name: MDFMD_${{ inputs.NI }}x${{ inputs.NJ }}_w${{ inputs.OMEGA }}_l${{ inputs.LL }}_c${{ inputs.C }}
          path: |
            MDFMD_${{ inputs.NI }}x${{ inputs.NJ }}_w*.mat
            MDFMD_${{ inputs.NI }}x${{ inputs.NJ }}_w*.csv
          retention-days: 90
